{% extends "orders/form.html" %}

{% block after_form %}
  {% if not object %}
    {# A customer that is not in the list yet: open the company screen on a new customer with that name (R-orders-038). #}
    <form method="get"
          action="{% url 'orders:company_create' %}"
          class="row g-2 align-items-end my-3">
      <input type="hidden" name="show" value="customers" />
      <div class="col-auto">
        <label class="form-label" for="new-customer-name">New customer</label>
        <input class="form-control"
               id="new-customer-name"
               name="name"
               maxlength="50" />
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-outline-secondary">Add customer</button>
      </div>
    </form>
  {% endif %}
{% endblock after_form %}
