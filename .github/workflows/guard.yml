name: guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hooks:
    runs-on: metronome-light
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure
